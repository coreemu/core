[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core"
version = "9.2.1"
description = "CORE Common Open Research Emulator"
authors = [{ name = "Boeing Research and Technology" }]
requires-python = ">=3.13,<4"
license = "BSD-2-Clause"
dependencies = [
    "fabric==3.2.2",
    "grpcio==1.69.0",
    "invoke==2.2.0",
    "lxml==5.4.0",
    "netaddr==0.10.1",
    "protobuf==5.29.3",
    "pyproj==3.7.2",
    "Mako==1.2.3",
    "PyYAML==6.0.1",
    "pillow==11.1.0",
]

[project.urls]
Repository = "https://github.com/coreemu/core"
Documentation = "https://coreemu.github.io/core/"

[project.scripts]
core-daemon = "core.scripts.daemon:main"
core-cli = "core.scripts.cli:main"
core-gui = "core.scripts.gui:main"
core-player = "core.scripts.player:main"
core-route-monitor = "core.scripts.routemonitor:main"
core-service-update = "core.scripts.serviceupdate:main"
core-cleanup = "core.scripts.cleanup:main"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "grpcio-tools==1.69.0",
    "pre-commit==4.1.0",
    "ruff>=0.15.15",
]

[tool.hatch.build.targets.sdist]
exclude = ["core/constants.py.in"]

[tool.hatch.build.targets.wheel]
artifacts = ["core/api/grpc/*_pb2*.py"]
exclude = ["core/constants.py.in"]

[tool.ruff.lint]
# "SIM",  # flake8-simplify (suggests code simplifications)
# "RUF",  # Ruff-specific rules
select = [
    "B", # flake8-bugbear (catches design flaws & bugs)
    "E", # pycodestyle errors
    "F", # Pyflakes (enabled by default)
    "I", # isort (import sorting)
    "UP", # pyupgrade (upgrades code to modern Python syntax)
    "W", # pycodestyle warnings
]
ignore = [
    "UP037", # Removes unnecessary quotes in type annotations
    "TC008", # Removes unnecessary quotes in type aliases
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
norecursedirs = [
    "distributed",
    "emane",
]
